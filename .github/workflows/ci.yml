name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build XPI
        run: npm run build

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: note-template-variables-xpi
          path: .scaffold/build/note-template-variables.xpi
          if-no-files-found: error
